name: Refresh Medium blogs

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-blogs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test feed loading and refresh
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/blogs.test.cjs
      - name: Refresh feed (preserve cached articles on failure)
        run: python scripts/refresh_blogs.py
      - name: Commit updated feed and request a Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- blogs.json; then
            echo 'Feed is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blogs.json
          git commit -m 'chore: refresh Medium blog feed'
          git push
          # GITHUB_TOKEN pushes do not automatically trigger legacy Pages builds.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
